name: Build & Deploy

# 从公开源码仓库 dhdbvcg/ForgeExt 拉取代码、构建后发布到本站。
#
# 为什么不在本地构建后推送产物：本地 Node 版本与 webpack 4 不兼容
# （Node 26 下跑 webpack 4 会 MODULE_NOT_FOUND），而云端能锁定
# .nvmrc 指定的 Node 版本。这样源码一更新，本站点就能跟着更新。
#
# ROOT=/ ：本站是账号页（仓库名即域名），站点在根路径，与
# dhdbvcg/ForgeExt 那份（子路径 /ForgeExt/）不同，两者产物不能混用。

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 16:00（北京时间 0:00）自动同步一次
    - cron: '0 16 * * *'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      NODE_OPTIONS: --openssl-legacy-provider
      # 注意：NODE_ENV=production 不能放 job 级 —— npm 在该模式下会跳过
      # devDependencies，而 webpack 正是 devDependency，会导致装不上。
      # 只在 Build 步骤设（见下）。

    steps:
      # 先取出本站仓库（用于拿到 .github 等自身配置）
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          path: site

      # 源码仓库是公开的，匿名 checkout 即可
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: dhdbvcg/ForgeExt
          ref: main
          path: src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'src/.nvmrc'

      # 仓库不跟踪 package-lock.json（依赖跟 TurboWarp develop 分支），
      # 且 webpack 锁 4.x 与 @webpack-cli/serve 的 peer（^5）冲突，
      # 必须 --legacy-peer-deps，否则 ERESOLVE 失败。
      - name: Install dependencies
        working-directory: src
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # 显式锁定构建工具链，对齐本地验证过的组合
      - name: Pin build toolchain
        working-directory: src
        run: |
          npm install --no-save --no-audit --no-fund --legacy-peer-deps webpack@4.47.0 webpack-cli@3.3.12
          npm ls webpack webpack-cli || true

      - name: Build
        working-directory: src
        run: npm run build:web
        env:
          NODE_ENV: production
          ROOT: /

      - name: Assemble site
        run: |
          # 保留本站自身的 .github（工作流不能被覆盖掉）
          rm -rf site/.github site/editor site/js site/static site/images site/microbit site/voice
          rm -f site/*.html site/*.png site/*.ico site/*.webmanifest site/robots.txt site/sw.js
          cp -r src/build/. site/
          touch site/.nojekyll
          ls site | head -20

      - name: Deploy
        run: |
          cd site
          git config user.name "ForgeExt"
          git config user.email "forgeext@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "无变化，跳过提交" && exit 0
          git commit -m "[skip ci] 同步 dhdbvcg/ForgeExt 最新源码构建"
          git push origin HEAD:main
